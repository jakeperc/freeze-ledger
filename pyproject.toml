[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeze-ledger"
version = "0.1.0"
description = "Open, reproducible dataset of USDT and USDC issuer freeze actions on Ethereum, Base, Tron and Solana, joined to the public record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jake Percy" }]
keywords = ["stablecoin", "usdt", "usdc", "ofac", "sanctions", "blockchain-intelligence", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
# The indexer and the verification suite run on the standard library alone.
# Parquet export is optional.
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.scripts]
freeze-ledger = "freeze_ledger.__main__:main"

[tool.setuptools.packages.find]
include = ["freeze_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: nightly

# One run a night: index forward from the checkpoints, refresh the SDN
# extract, re-grade attributions, rebuild latest.json, and VERIFY before
# anything is committed. On failure nothing is pushed and an issue is opened
# with the log.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC
  workflow_dispatch:
    inputs:
      max_calls:
        description: "provider call budget per chain"
        default: "1500"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FL_TRON_API_KEY: ${{ secrets.FL_TRON_API_KEY }}
      FL_ETH_RPC: ${{ secrets.FL_ETH_RPC }}
      FL_BASE_RPC: ${{ secrets.FL_BASE_RPC }}
      FL_SOL_RPC: ${{ secrets.FL_SOL_RPC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Solana USDT is skipped until `backfill --chain solana --token USDT`
      # has been run; drop the --skip then.
      - name: Index forward
        run: python -m freeze_ledger run --skip solana:USDT --max-calls ${{ inputs.max_calls || 1500 }} 2>&1 | tee run.log

      - name: Refresh SDN extract
        continue-on-error: true
        run: python -m freeze_ledger sdn 2>&1 | tee -a run.log

      - name: Attribute
        run: python -m freeze_ledger attribute 2>&1 | tee -a run.log

      - name: Export
        run: python -m freeze_ledger export 2>&1 | tee -a run.log

      - name: Verify (gate)
        run: python verify.py --sample 5 2>&1 | tee -a run.log

      - name: Commit and tag
        if: success()
        run: |
          set -e
          git config user.name "freeze-ledger nightly"
          git config user.email "noreply@users.noreply.github.com"
          git add data/ evidence/raw/
          if git diff --cached --quiet; then
            echo "no data changes tonight"
            exit 0
          fi
          DAY=$(date -u +%Y.%m.%d)
          git commit -m "nightly: ${DAY}" -m "$(python -m freeze_ledger status)"
          git tag -f "v${DAY}"
          git push origin HEAD
          git push -f origin "v${DAY}"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          retention-days: 30

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('run.log', 'utf8').slice(-6000); } catch (e) {}
            const day = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `nightly failed ${day}`,
              body: `The nightly run failed and nothing was committed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n<details><summary>last lines of the log</summary>\n\n\`\`\`\n${log}\n\`\`\`\n</details>`,
              labels: ['nightly-failure'],
            });
